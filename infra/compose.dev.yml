name: transport-erp-dev

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-transport_erp}
      POSTGRES_USER: ${POSTGRES_USER:-transport_erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transport_erp_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
    environment:
      TRANSPORT_ERP_APP_NAME: TransportERP-UA
      TRANSPORT_ERP_ENVIRONMENT: development
      TRANSPORT_ERP_DEBUG: "false"
      TRANSPORT_ERP_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-transport_erp}:${POSTGRES_PASSWORD:-transport_erp_dev}@db:5432/${POSTGRES_DB:-transport_erp}
      TRANSPORT_ERP_SESSION_TTL_MINUTES: "480"
      TRANSPORT_ERP_COOKIE_SECURE: "false"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
