[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "transport-erp-backend"
version = "0.1.0"
description = "TransportERP-UA backend application shell"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2.0",
  "argon2-cffi>=23.1,<26.0",
  "fastapi>=0.115,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic-settings>=2.5,<3.0",
  "reportlab>=4.2,<5.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
desktop = [
  "pywebview>=5.3,<6.0",
]
dev = [
  "httpx>=0.27,<1.0",
  "mypy>=1.11,<2.0",
  "pytest>=8.3,<9.0",
  "ruff>=0.6,<1.0",
]

[project.scripts]
transport-erp-desktop = "transport_erp.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "postgres: requires a real PostgreSQL database",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 flags FastAPI's standard Query(...) dependency/default pattern.
# E501 is formatting only and must not block functional preview builds.
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
# Taxo-compatible / established files are kept stable unless a functional change needs touching them.
"src/transport_erp/api/stoir.py" = ["UP037"]
"src/transport_erp/api/waybills.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["transport_erp.api.waybills", "transport_erp.api.waybill_pdf_current"]
disable_error_code = ["no-untyped-call"]

[[tool.mypy.overrides]]
module = "transport_erp.api.waybill_actuals"
disable_error_code = ["no-any-return"]

[[tool.mypy.overrides]]
module = "transport_erp.api.stoir"
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = "webview"
ignore_missing_imports = true
