overlay: 1.0.0
info:
  title: TransportERP-UA M0 regulatory freeze overlay
  version: 1.0.0
  description: >-
    Обов'язковий overlay до openapi-mvp-v1.yaml. Узгоджує machine-readable
    contract із regulatory/business review 15.09.2026 та architecture-v1.5 freeze.
actions:
  - target: $.components.schemas.MedicalCheckCreate.properties.result
    description: Щозмінний medical result має тільки FIT або UNFIT.
    update:
      type: string
      enum: [FIT, UNFIT]

  - target: $.components.schemas
    description: Додає schemas для driver pre-departure check та Waybill create policy.
    update:
      DriverPredepartureCheckCreate:
        type: object
        required: [vehicle_id, items]
        properties:
          vehicle_id:
            type: string
            format: uuid
          odometer_km:
            type: [integer, 'null']
            minimum: 0
          items:
            type: array
            minItems: 1
            items:
              type: object
              required: [template_item_id, value]
              properties:
                template_item_id:
                  type: string
                  format: uuid
                value: {}
                comment:
                  type: [string, 'null']
          comment:
            type: [string, 'null']
      WaybillCreate:
        type: object
        properties:
          document_role:
            type: string
            default: PRIMARY
            minLength: 1
          series:
            type: [string, 'null']
            description: Optional requested/configured series; server numbering policy remains authoritative.

  - target: $.paths
    description: Додає окремий driver pre-departure technical check resource.
    update:
      /releases/{release_id}/driver-predeparture-checks:
        get:
          tags: [Release]
          summary: Передвиїзні перевірки технічного стану, виконані водієм
          x-permission: driver_predeparture_check.read
          parameters:
            - $ref: '#/components/parameters/ReleaseId'
          responses:
            '200':
              description: OK
        post:
          tags: [Release]
          summary: Зафіксувати передвиїзну перевірку технічного стану водієм
          x-permission: driver_predeparture_check.perform
          x-scope: assigned-driver-own-duty
          parameters:
            - $ref: '#/components/parameters/ReleaseId'
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/DriverPredepartureCheckCreate'
          responses:
            '201':
              description: Created
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/CheckResponse'
            '403':
              description: Caller is not the assigned driver or lacks explicit permission
      /driver-predeparture-checks/{check_id}:
        get:
          tags: [Release]
          summary: Деталі передвиїзної перевірки водієм
          x-permission: driver_predeparture_check.read
          parameters:
            - name: check_id
              in: path
              required: true
              schema:
                type: string
                format: uuid
          responses:
            '200':
              description: OK
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/CheckResponse'
      /driver-predeparture-checks/{check_id}/invalidate:
        post:
          tags: [Release]
          summary: Визнати completed driver pre-departure check недійсним із збереженням history
          x-permission: driver_predeparture_check.invalidate
          parameters:
            - name: check_id
              in: path
              required: true
              schema:
                type: string
                format: uuid
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/CommentCommand'
          responses:
            '200':
              description: Invalidated

  - target: "$['paths']['/duties/{duty_id}/waybills']['post']"
    description: Waybill create приймає explicit document_role; PRIMARY є default enterprise policy.
    update:
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WaybillCreate'

  - target: $.components.schemas.WaybillRead
    description: Waybill response явно повертає document_role.
    update:
      required: [id, duty_id, document_role, full_number, status, row_version]
      properties:
        id:
          type: string
          format: uuid
        duty_id:
          type: string
          format: uuid
        document_role:
          type: string
        full_number:
          type: string
        status:
          type: string
        current_version_id:
          type: [string, 'null']
          format: uuid
        issued_at:
          type: [string, 'null']
          format: date-time
        returned_at:
          type: [string, 'null']
          format: date-time
        closed_at:
          type: [string, 'null']
          format: date-time
        row_version:
          type: integer
