components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: session
      description: Secure HttpOnly browser session cookie. Exact provider may evolve without changing
        domain API.
    SessionCookie:
      type: apiKey
      in: cookie
      name: transport_erp_session
    CsrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
      description: Optimistic concurrency token / ETag.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 200
    VehicleId:
      name: vehicle_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TripId:
      name: trip_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DutyId:
      name: duty_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReleaseId:
      name: release_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WaybillId:
      name: waybill_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthenticated:
      description: Unauthenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Entity not found in caller scope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Business or concurrency conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Meta:
      type: object
      required:
      - request_id
      properties:
        request_id:
          type: string
          format: uuid
    PageMeta:
      allOf:
      - $ref: '#/components/schemas/Meta'
      - type: object
        required:
        - page
        - page_size
        - total
        properties:
          page:
            type: integer
          page_size:
            type: integer
          total:
            type: integer
    ErrorResponse:
      type: object
      required:
      - error
      - meta
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
        meta:
          $ref: '#/components/schemas/Meta'
    AuthMeResponse:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          required:
          - id
          - username
          - permissions
          - locale
          properties:
            id:
              type: string
              format: uuid
            username:
              type: string
            permissions:
              type: array
              items:
                type: string
            locale:
              type: string
              enum:
              - uk
              - en
              - es
              - fr
              - de
          $ref: '#/components/schemas/AuthMeData'
        meta:
          $ref: '#/components/schemas/Meta'
    VehicleCreate:
      type: object
      required:
      - fleet_number
      - registration_number
      - make
      - model
      properties:
        depot_id:
          type:
          - string
          - 'null'
          format: uuid
        fleet_number:
          type: string
        registration_number:
          type: string
        vin:
          type:
          - string
