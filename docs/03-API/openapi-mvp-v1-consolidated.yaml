openapi: 3.1.0
info:
  title: TransportERP-UA API
  version: 1.0.0-m0
  description: Машинозчитуваний контракт першого production MVP. Канонічний опис архітектури та бізнес-семантики
    ведеться українською у docs/03-API.
servers:
- url: /api/v1
security:
- sessionAuth: []
tags:
- name: Auth
- name: Vehicles
- name: Drivers
- name: Trips
- name: Duties
- name: Release
- name: Waybills
- name: Fuel
- name: Maintenance
- name: Reports
- name: Audit
paths:
  /auth/me:
    get:
      tags:
      - Identity
      summary: Поточний користувач та effective permissions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMeResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
          description: Session required
      security:
      - SessionCookie: []
  /vehicles:
    get:
      tags:
      - Vehicles
      summary: Список автобусів
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleListResponse'
    post:
      tags:
      - Vehicles
      summary: Створити автобус
      x-permission: vehicle.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /vehicles/{vehicle_id}:
    parameters:
    - $ref: '#/components/parameters/VehicleId'
    get:
      tags:
      - Vehicles
      summary: Картка автобуса
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Vehicles
      summary: Змінити дозволені master-data поля автобуса
      x-permission: vehicle.update
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleResponse'
        '409':
          $ref: '#/components/responses/Conflict'
  /drivers:
    get:
      tags:
      - Drivers
      summary: Список водіїв
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverListResponse'
    post:
      tags:
      - Drivers
      summary: Створити водія
      x-permission: driver.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverResponse'
  /trips:
    get:
      tags:
      - Trips
      summary: Список рейсів
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: service_date
        in: query
        schema:
          type: string
          format: date
      - name: status
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripListResponse'
    post:
      tags:
      - Trips
      summary: Створити нерегулярний/додатковий рейс
      x-permission: trip.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripResponse'
  /trips/{trip_id}:
    parameters:
    - $ref: '#/components/parameters/TripId'
    get:
      tags:
      - Trips
      summary: Деталі рейсу
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripResponse'
  /trips/{trip_id}/cancel:
    post:
      tags:
      - Trips
      summary: Скасувати рейс
      x-permission: trip.cancel
      parameters:
      - $ref: '#/components/parameters/TripId'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelCommand'
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripResponse'
        '409':
          $ref: '#/components/responses/Conflict'
  /trips/{trip_id}/depart:
    post:
      tags:
      - Trips
      summary: Зафіксувати фактичний початок рейсу
      x-permission: trip.depart
      parameters:
      - $ref: '#/components/parameters/TripId'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OccurredAtCommand'
      responses:
        '200':
          description: Departed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripResponse'
        '409':
          $ref: '#/components/responses/Conflict'
  /trips/{trip_id}/complete:
    post:
      tags:
      - Trips
      summary: Завершити фактичне виконання рейсу
      x-permission: trip.complete
      parameters:
      - $ref: '#/components/parameters/TripId'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OccurredAtCommand'
      responses:
        '200':
          description: Completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripResponse'
        '409':
          $ref: '#/components/responses/Conflict'
  /trips/{trip_id}/close:
    post:
      tags:
      - Trips
      summary: Закрити рейс та створити immutable actual snapshot
      x-permission: trip.close
      parameters:
      - $ref: '#/components/parameters/TripId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /duties:
    get:
      tags:
      - Duties
      summary: Список нарядів
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: service_date
        in: query
        schema:
          type: string
          format: date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DutyListResponse'
    post:
      tags:
      - Duties
      summary: Створити Duty
      x-permission: duty.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DutyCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DutyResponse'
  /duties/{duty_id}:
    parameters:
    - $ref: '#/components/parameters/DutyId'
    get:
      tags:
      - Duties
      summary: Деталі Duty
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DutyResponse'
  /duties/{duty_id}/assign-vehicle:
    post:
      tags:
      - Duties
      summary: Призначити автобус
      x-permission: duty.vehicle.assign
      parameters:
      - $ref: '#/components/parameters/DutyId'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignVehicleCommand'
      responses:
        '200':
          description: Assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DutyResponse'
        '409':
          $ref: '#/components/responses/Conflict'
  /duties/{duty_id}/assign-driver:
    post:
      tags:
      - Duties
      summary: Призначити водія
      x-permission: duty.driver.assign
      parameters:
      - $ref: '#/components/parameters/DutyId'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignDriverCommand'
      responses:
        '200':
          description: Assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DutyResponse'
        '409':
          $ref: '#/components/responses/Conflict'
  /duties/{duty_id}/replace-vehicle:
    post:
      tags:
      - Duties
      summary: Контрольовано замінити автобус
      x-permission: duty.replace_vehicle
      parameters:
      - $ref: '#/components/parameters/DutyId'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceVehicleCommand'
      responses:
        '200':
          description: Replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DutyResponse'
        '409':
          $ref: '#/components/responses/Conflict'
  /duties/{duty_id}/depart:
    post:
      tags:
      - Duties
      summary: Фактичний виїзд із депо
      x-permission: duty.depart
      parameters:
      - $ref: '#/components/parameters/DutyId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DutyMovementCommand'
      responses:
        '200':
          description: On line
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DutyResponse'
        '409':
          $ref: '#/components/responses/Conflict'
  /duties/{duty_id}/return:
    post:
      tags:
      - Duties
      summary: Фактичне повернення в депо
      x-permission: duty.return
      parameters:
      - $ref: '#/components/parameters/DutyId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DutyMovementCommand'
      responses:
        '200':
          description: Returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DutyResponse'
        '409':
          $ref: '#/components/responses/Conflict'
  /duties/{duty_id}/close:
    post:
      tags:
      - Duties
      summary: Закрити Duty
      x-permission: duty.close
      parameters:
      - $ref: '#/components/parameters/DutyId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DutyResponse'
        '409':
          $ref: '#/components/responses/Conflict'
  /duties/{duty_id}/release:
    get:
      tags:
      - Release
      summary: Release для Duty
      parameters:
      - $ref: '#/components/parameters/DutyId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseResponse'
  /releases/{release_id}/evaluate:
    post:
      tags:
      - Release
      summary: Зберегти новий batch compliance evaluation
      x-permission: release.evaluate
      parameters:
      - $ref: '#/components/parameters/ReleaseId'
      responses:
        '200':
          description: Evaluated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseEvaluationResponse'
  /releases/{release_id}/authorize:
    post:
      tags:
      - Release
      summary: Авторизувати випуск після fresh evaluation
      x-permission: release.authorize
      parameters:
      - $ref: '#/components/parameters/ReleaseId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentCommand'
      responses:
        '200':
          description: Authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseResponse'
        '409':
          $ref: '#/components/responses/Conflict'
  /releases/{release_id}/medical-checks:
    post:
      tags:
      - Release
      summary: Завершити передрейсовий медичний контроль
      x-permission: medical_check.perform
      parameters:
      - $ref: '#/components/parameters/ReleaseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MedicalCheckCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckResponse'
  /releases/{release_id}/technical-checks:
    post:
      tags:
      - Release
      summary: Завершити передрейсовий технічний контроль
      x-permission: technical_check.perform
      parameters:
      - $ref: '#/components/parameters/ReleaseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TechnicalCheckCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckResponse'
  /waybills:
    get:
      tags:
      - Waybills
      summary: Список шляхових листів
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaybillListResponse'
  /duties/{duty_id}/waybills:
    post:
      tags:
      - Waybills
      summary: Створити шляховий лист для Duty
      x-permission: waybill.create
      parameters:
      - $ref: '#/components/parameters/DutyId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaybillResponse'
        '409':
          $ref: '#/components/responses/Conflict'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WaybillCreate'
  /waybills/{waybill_id}:
    get:
      tags:
      - Waybills
      summary: Деталі шляхового листа
      parameters:
      - $ref: '#/components/parameters/WaybillId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaybillResponse'
  /waybills/{waybill_id}/generate:
    post:
      tags:
      - Waybills
      summary: Створити нову document version і PDF
      x-permission: waybill.generate
      parameters:
      - $ref: '#/components/parameters/WaybillId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaybillResponse'
  /waybills/{waybill_id}/issue:
    post:
      tags:
      - Waybills
      summary: Видати шляховий лист
      x-permission: waybill.issue
      parameters:
      - $ref: '#/components/parameters/WaybillId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaybillResponse'
        '409':
          $ref: '#/components/responses/Conflict'
  /waybills/{waybill_id}/close:
    post:
      tags:
      - Waybills
      summary: Закрити шляховий лист
      x-permission: waybill.close
      parameters:
      - $ref: '#/components/parameters/WaybillId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaybillResponse'
        '409':
          $ref: '#/components/responses/Conflict'
  /waybills/{waybill_id}/corrections:
    post:
      tags:
      - Waybills
      summary: Створити correction case для closed waybill
      x-permission: waybill.correct
      parameters:
      - $ref: '#/components/parameters/WaybillId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorrectionCreate'
      responses:
        '201':
          description: Correction created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorrectionResponse'
  /fuel-operations:
    get:
      tags:
      - Fuel
      summary: Список паливних операцій
      responses:
        '200':
          description: OK
    post:
      tags:
      - Fuel
      summary: Записати паливну операцію
      x-permission: fuel.record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FuelOperationCreate'
      responses:
        '201':
          description: Created
  /repair-orders:
    get:
      tags:
      - Maintenance
      summary: Список ремонтних нарядів
      responses:
        '200':
          description: OK
    post:
      tags:
      - Maintenance
      summary: Створити ремонтний наряд
      x-permission: repair.manage
      responses:
        '201':
          description: Created
  /reports/daily-trips:
    get:
      tags:
      - Reports
      summary: Операційний звіт рейсів за день
      x-permission: report.operational.read
      parameters:
      - name: service_date
        in: query
        required: true
        schema:
          type: string
          format: date
      responses:
        '200':
          description: OK
  /audit/entities/{entity_type}/{entity_id}:
    get:
      tags:
      - Audit
      summary: Audit timeline сутності
      x-permission: audit.read
      parameters:
      - name: entity_type
        in: path
        required: true
        schema:
          type: string
      - name: entity_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
  /releases/{release_id}/driver-predeparture-checks:
    get:
      tags:
      - Release
      summary: Передвиїзні перевірки технічного стану, виконані водієм
      x-permission: driver_predeparture_check.read
      parameters:
      - $ref: '#/components/parameters/ReleaseId'
      responses:
        '200':
          description: OK
    post:
      tags:
      - Release
      summary: Зафіксувати передвиїзну перевірку технічного стану водієм
      x-permission: driver_predeparture_check.perform
      x-scope: assigned-driver-own-duty
      parameters:
      - $ref: '#/components/parameters/ReleaseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverPredepartureCheckCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckResponse'
        '403':
          description: Caller is not the assigned driver or lacks explicit permission
  /driver-predeparture-checks/{check_id}:
    get:
      tags:
      - Release
      summary: Деталі передвиїзної перевірки водієм
      x-permission: driver_predeparture_check.read
      parameters:
      - name: check_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckResponse'
  /driver-predeparture-checks/{check_id}/invalidate:
    post:
      tags:
      - Release
      summary: Визнати completed driver pre-departure check недійсним із збереженням history
      x-permission: driver_predeparture_check.invalidate
      parameters:
      - name: check_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentCommand'
      responses:
        '200':
          description: Invalidated
  /auth/login:
    post:
      tags:
      - Identity
      summary: Створити browser session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
      responses:
        '200':
          description: Session created; opaque token is returned only as HttpOnly cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMeResponse'
        '401':
          description: Invalid credentials
        '403':
          description: Account unavailable
  /auth/refresh:
    post:
      tags:
      - Identity
      summary: Rotate current browser session
      security:
      - SessionCookie: []
        CsrfHeader: []
      responses:
        '200':
          description: Session rotated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMeResponse'
        '401':
          description: Session unavailable
  /auth/logout:
    post:
      tags:
      - Identity
      summary: Revoke current browser session
      security:
      - SessionCookie: []
        CsrfHeader: []
      responses:
        '204':
          description: Session revoked
  /auth/permissions:
    get:
      tags:
      - Identity
      summary: Effective permissions поточного користувача
      security:
      - SessionCookie: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionListResponse'
  /users:
    get:
      tags:
      - Identity
      summary: Користувачі tenant
      x-permission: user.read
      security:
      - SessionCookie: []
      responses:
