name: Windows Python START Preview

on:
  push:
    branches:
      - work/v0.2-python-preview-r1
    paths:
      - PREVIEW_VERSION.txt
      - START_WINDOWS.bat
      - README-PYTHON-PREVIEW.txt
      - CHECKPOINT_CURRENT.md
      - CHECKPOINT_v0_2_r1.md
      - backend/**
      - frontend/**
      - .github/workflows/python-preview-windows.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-python-preview:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read preview version
        shell: pwsh
        run: |
          $version = (Get-Content PREVIEW_VERSION.txt -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($version)) { throw "PREVIEW_VERSION.txt is empty" }
          "PREVIEW_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PACKAGE_DIR=TransportERP-UA_v$($version)_TEST_r1_START" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PACKAGE_ZIP=TransportERP-UA_v$($version)_TEST_r1_START.zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install and test backend
        working-directory: backend
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[desktop,dev]"
          ruff check .
          mypy
          pytest -q

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Test and build prepared frontend
        working-directory: frontend
        run: |
          npm install
          npm run lint
          npm run typecheck
          npm run build

      - name: Create versioned START folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "$env:PACKAGE_DIR" -Force | Out-Null
          New-Item -ItemType Directory -Path "$env:PACKAGE_DIR\frontend\out" -Force | Out-Null
          Copy-Item "START_WINDOWS.bat" "$env:PACKAGE_DIR\START_WINDOWS.bat"
          Copy-Item "README-PYTHON-PREVIEW.txt" "$env:PACKAGE_DIR\README-PYTHON-PREVIEW.txt"
          Copy-Item "PREVIEW_VERSION.txt" "$env:PACKAGE_DIR\PREVIEW_VERSION.txt"
          Copy-Item "CHECKPOINT_CURRENT.md" "$env:PACKAGE_DIR\CHECKPOINT_CURRENT.md"
          Copy-Item "CHECKPOINT_v0_2_r1.md" "$env:PACKAGE_DIR\CHECKPOINT_v0_2_r1.md"
          Copy-Item "backend" "$env:PACKAGE_DIR\backend" -Recurse
          Copy-Item "frontend\out\*" "$env:PACKAGE_DIR\frontend\out" -Recurse

          Get-ChildItem "$env:PACKAGE_DIR\backend" -Recurse -Directory -Force |
            Where-Object { $_.Name -in @('__pycache__','.pytest_cache','.mypy_cache','.ruff_cache','.venv') } |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem "$env:PACKAGE_DIR\backend" -Recurse -File -Include *.pyc |
            Remove-Item -Force -ErrorAction SilentlyContinue

          $db = Get-ChildItem "$env:PACKAGE_DIR" -Recurse -File -Include *.db,*.sqlite,*.sqlite3
          if ($db) { throw "Database unexpectedly bundled: $($db.FullName -join ', ')" }

      - name: Create START ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "$env:PACKAGE_DIR" -DestinationPath "$env:PACKAGE_ZIP" -Force
          Get-Item "$env:PACKAGE_ZIP" | Format-List Name,Length

      - name: Upload START package
        uses: actions/upload-artifact@v4
        with:
          name: TransportERP-UA-v${{ env.PREVIEW_VERSION }}-r1-START
          path: ${{ env.PACKAGE_ZIP }}
          if-no-files-found: error
          retention-days: 30
