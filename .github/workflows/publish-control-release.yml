name: Build and publish TransportERP-UA control release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      version_safe: ${{ steps.meta.outputs.version_safe }}
      revision: ${{ steps.meta.outputs.revision }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        shell: bash
        run: |
          version="$(tr -d '\r\n' < PREVIEW_VERSION.txt)"
          revision="$(tr -d '\r\n' < PREVIEW_REVISION.txt)"
          version_safe="${version//./_}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "version_safe=${version_safe}" >> "$GITHUB_OUTPUT"
          echo "revision=${revision}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}-${revision}" >> "$GITHUB_OUTPUT"

  build-start:
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Build START package using repository recipe
        shell: bash
        run: bash BUILD_START.sh
      - uses: actions/upload-artifact@v4
        with:
          name: TransportERP-UA-${{ needs.metadata.outputs.tag }}-START
          path: TransportERP-UA_v${{ needs.metadata.outputs.version_safe }}_TEST_${{ needs.metadata.outputs.revision }}_START.zip
          if-no-files-found: error
          retention-days: 90

  build-windows:
    needs: metadata
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Build Windows portable using repository recipe
        shell: cmd
        run: BUILD_WINDOWS.bat
      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup --no-progress -y }
      - name: Build Windows installer using repository recipe
        shell: cmd
        run: BUILD_INSTALLER.bat
      - uses: actions/upload-artifact@v4
        with:
          name: TransportERP-UA-${{ needs.metadata.outputs.tag }}-Windows-x64
          path: |
            TransportERP-UA_v${{ needs.metadata.outputs.version_safe }}_TEST_${{ needs.metadata.outputs.revision }}_Windows_x64_Portable.zip
            release_out/TransportERP-UA_v${{ needs.metadata.outputs.version_safe }}_TEST_${{ needs.metadata.outputs.revision }}_Setup_Windows_x64.exe
          if-no-files-found: error
          retention-days: 90

  build-macos:
    needs: metadata
    name: Build macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Verify runner architecture
        shell: bash
        run: test "$(uname -m)" = "${{ matrix.arch }}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Build macOS package using repository recipe
        shell: bash
        run: bash BUILD_MACOS.sh
      - uses: actions/upload-artifact@v4
        with:
          name: TransportERP-UA-${{ needs.metadata.outputs.tag }}-macOS-${{ matrix.arch }}
          path: TransportERP-UA_v${{ needs.metadata.outputs.version_safe }}_TEST_${{ needs.metadata.outputs.revision }}_macOS_${{ matrix.arch }}_Portable.zip
          if-no-files-found: error
          retention-days: 90

  publish-release:
    needs:
      - metadata
      - build-start
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: TransportERP-UA-${{ needs.metadata.outputs.tag }}-*
          path: release-assets
          merge-multiple: true
      - name: Prepare checksums
        shell: bash
        run: |
          mkdir release-upload
          find release-assets -type f -name 'TransportERP-UA_v${{ needs.metadata.outputs.version_safe }}_TEST_${{ needs.metadata.outputs.revision }}_START.zip' -exec cp '{}' release-upload/ \;
          find release-assets -type f -name 'TransportERP-UA_v${{ needs.metadata.outputs.version_safe }}_TEST_${{ needs.metadata.outputs.revision }}_Setup_Windows_x64.exe' -exec cp '{}' release-upload/ \;
          find release-assets -type f -name 'TransportERP-UA_v${{ needs.metadata.outputs.version_safe }}_TEST_${{ needs.metadata.outputs.revision }}_Windows_x64_Portable.zip' -exec cp '{}' release-upload/ \;
          find release-assets -type f -name 'TransportERP-UA_v${{ needs.metadata.outputs.version_safe }}_TEST_${{ needs.metadata.outputs.revision }}_macOS_arm64_Portable.zip' -exec cp '{}' release-upload/ \;
          find release-assets -type f -name 'TransportERP-UA_v${{ needs.metadata.outputs.version_safe }}_TEST_${{ needs.metadata.outputs.revision }}_macOS_x86_64_Portable.zip' -exec cp '{}' release-upload/ \;
          cd release-upload
          sha256sum TransportERP-UA_* > 'SHA256SUMS_v${{ needs.metadata.outputs.version_safe }}_TEST_${{ needs.metadata.outputs.revision }}.txt'
          sha256sum -c 'SHA256SUMS_v${{ needs.metadata.outputs.version_safe }}_TEST_${{ needs.metadata.outputs.revision }}.txt'
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.metadata.outputs.tag }}
        shell: bash
        run: |
          notes="RELEASE_NOTES_v${{ needs.metadata.outputs.version_safe }}_${{ needs.metadata.outputs.revision }}.md"
          if [[ ! -f "$notes" ]]; then notes='CHECKPOINT_CURRENT.md'; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "TransportERP-UA $TAG — executable testing release" --notes-file "$notes" --prerelease
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "TransportERP-UA $TAG — executable testing release" --notes-file "$notes" --prerelease
          fi
          gh release upload "$TAG" release-upload/* --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: TransportERP-UA-${{ needs.metadata.outputs.tag }}-release-manifest
          path: |
            release-upload/TransportERP-UA_v${{ needs.metadata.outputs.version_safe }}_TEST_${{ needs.metadata.outputs.revision }}_START.zip
            release-upload/SHA256SUMS_v${{ needs.metadata.outputs.version_safe }}_TEST_${{ needs.metadata.outputs.revision }}.txt
          if-no-files-found: error
          retention-days: 90
