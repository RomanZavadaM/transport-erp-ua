name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy
      - name: Pytest
        run: pytest -q

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install frontend
        run: npm install
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Build
        run: npm run build

  openapi:
    name: OpenAPI contract
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/openapi/requirements.txt
      - name: Install OpenAPI tooling
        run: pip install -r tools/openapi/requirements.txt
      - name: Build consolidated contract
        run: >-
          python tools/openapi/consolidate.py
          --base docs/03-API/openapi-mvp-v1.yaml
          --overlay docs/03-API/openapi-mvp-v1-freeze-overlay.yaml
          --output .artifacts/openapi/openapi-mvp-v1.yaml
      - name: Validate consolidated contract
        run: python tools/openapi/validate.py .artifacts/openapi/openapi-mvp-v1.yaml
      - name: Sync generated contract into same-repo PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          target=docs/03-API/openapi-mvp-v1-consolidated.yaml
          cp .artifacts/openapi/openapi-mvp-v1.yaml "$target"
          if [ -z "$(git status --porcelain -- "$target")" ]; then
            echo "Consolidated OpenAPI is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          git commit -m "build: sync consolidated OpenAPI contract"
          git push origin "HEAD:${{ github.head_ref }}"
      - name: Check committed consolidated contract freshness
        shell: bash
        run: |
          target=docs/03-API/openapi-mvp-v1-consolidated.yaml
          test -f "$target"
          if ! cmp --silent .artifacts/openapi/openapi-mvp-v1.yaml "$target"; then
            echo "::error::Committed consolidated OpenAPI is stale"
            diff -u "$target" .artifacts/openapi/openapi-mvp-v1.yaml || true
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: openapi-consolidated
          path: .artifacts/openapi/openapi-mvp-v1.yaml
          if-no-files-found: error

  compose:
    name: Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate development compose
        run: docker compose -f infra/compose.dev.yml config
