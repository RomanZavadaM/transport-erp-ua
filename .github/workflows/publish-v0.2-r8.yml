name: Build and publish TransportERP-UA v0.2 r8 executables

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v0.2-r8.yml'

permissions:
  contents: write

jobs:
  build-start:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: '1'
      PACKAGE_DIR: TransportERP-UA_v0_2_TEST_r8_START
      PACKAGE_ZIP: TransportERP-UA_v0_2_TEST_r8_START.zip
    steps:
      - name: Checkout r8 source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Verify backend
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './backend[desktop,dev]'
          cd backend
          ruff check .
          mypy
          pytest -q

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Verify and build frontend
        working-directory: frontend
        shell: bash
        run: |
          npm install
          npm run lint
          npm run typecheck
          npm run build

      - name: Create START package
        shell: bash
        run: |
          mkdir -p "$PACKAGE_DIR/frontend/out"
          cp START_WINDOWS.bat OPEN_DATA_FOLDER.bat README-PYTHON-PREVIEW.txt "$PACKAGE_DIR/"
          cp PREVIEW_VERSION.txt PREVIEW_REVISION.txt CHECKPOINT_CURRENT.md CHECKPOINT_v0_2_r8.md RELEASE_NOTES_v0_2_r8.md "$PACKAGE_DIR/"
          cp -R backend "$PACKAGE_DIR/backend"
          cp -R frontend/out/. "$PACKAGE_DIR/frontend/out/"
          find "$PACKAGE_DIR" -type d \( -name '__pycache__' -o -name '.pytest_cache' -o -name '.mypy_cache' -o -name '.ruff_cache' -o -name '.venv' \) -prune -exec rm -rf '{}' + || true
          find "$PACKAGE_DIR" -type f \( -name '*.pyc' -o -name '*.db' -o -name '*.sqlite' -o -name '*.sqlite3' \) -delete
          zip -r "$PACKAGE_ZIP" "$PACKAGE_DIR" >/dev/null
          if unzip -l "$PACKAGE_ZIP" | grep -Eiq '\.(db|sqlite|sqlite3)([[:space:]]|$)|__pycache__|\.pyc([[:space:]]|$)'; then
            echo 'Database or cache unexpectedly bundled in START package' >&2
            exit 1
          fi

      - name: Upload START package
        uses: actions/upload-artifact@v4
        with:
          name: TransportERP-UA-v0.2-r8-START
          path: TransportERP-UA_v0_2_TEST_r8_START.zip
          if-no-files-found: error
          retention-days: 90

  build-windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      BUNDLE_DIR: TransportERP-UA_v0_2_TEST_r8_Windows_x64
      BUNDLE_ZIP: TransportERP-UA_v0_2_TEST_r8_Windows_x64_Portable.zip
      SETUP_EXE: TransportERP-UA_v0_2_TEST_r8_Setup_Windows_x64.exe
    steps:
      - name: Checkout r8 source
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Build frontend
        working-directory: frontend
        shell: pwsh
        run: |
          npm install
          npm run build

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install desktop packaging dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.\backend[desktop]'
          python -m pip install 'pyinstaller>=6.10,<7.0'

      - name: Build Windows portable application
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --windowed `
            --name 'TransportERP-UA' `
            --paths 'backend/src' `
            --add-data 'frontend/out;frontend' `
            --collect-all webview `
            'backend/src/transport_erp/desktop.py'
          Move-Item 'dist/TransportERP-UA' "dist/$env:BUNDLE_DIR"

      - name: Verify Windows bundle
        shell: pwsh
        run: |
          $bundle = "dist/$env:BUNDLE_DIR"
          if (!(Test-Path "$bundle/TransportERP-UA.exe")) { throw 'TransportERP-UA.exe not found' }
          $db = Get-ChildItem $bundle -Recurse -File -Include *.db,*.sqlite,*.sqlite3
          if ($db) { throw "Database unexpectedly bundled: $($db.FullName -join ', ')" }
          $env:TRANSPORT_ERP_SMOKE_TEST_ONLY = '1'
          $process = Start-Process -FilePath "$bundle/TransportERP-UA.exe" -PassThru
          if (-not $process.WaitForExit(30000)) {
            Stop-Process -Id $process.Id -Force
            throw 'Packaged Windows smoke test timed out'
          }
          Remove-Item Env:TRANSPORT_ERP_SMOKE_TEST_ONLY -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 0) { throw "Windows smoke test failed with exit code $($process.ExitCode)" }
          $notes = @"
          TransportERP-UA v0.2 TEST r8 — Windows x64 portable

          Дані не зберігаються в цій папці.
          Робоча БД/документи/backup: %LOCALAPPDATA%\TransportERP-UA
          "@
          Set-Content -Path "$bundle/README-START.txt" -Value $notes -Encoding UTF8

      - name: Create Windows Portable ZIP
        shell: pwsh
        run: Compress-Archive -Path "dist/$env:BUNDLE_DIR" -DestinationPath "$env:BUNDLE_ZIP" -Force

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          if (!(Test-Path $iscc)) { throw 'Inno Setup compiler not found' }
          & $iscc '/DMyAppVersion=0.2-r8' "/DBundleDir=dist\$env:BUNDLE_DIR" "/DOutputBaseFilename=$($env:SETUP_EXE -replace '\.exe$','')" 'installer\TransportERP-UA.iss'
          if (!(Test-Path "release_out/$env:SETUP_EXE")) { throw 'Windows installer not found' }

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: TransportERP-UA-v0.2-r8-Windows-x64
          path: |
            TransportERP-UA_v0_2_TEST_r8_Windows_x64_Portable.zip
            release_out/TransportERP-UA_v0_2_TEST_r8_Setup_Windows_x64.exe
          if-no-files-found: error
          retention-days: 90

  build-macos:
    name: Build macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Checkout r8 source
        uses: actions/checkout@v4

      - name: Verify runner architecture
        shell: bash
        run: test "$(uname -m)" = "${{ matrix.arch }}"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Build frontend
        working-directory: frontend
        shell: bash
        run: |
          npm install
          npm run build

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install desktop packaging dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './backend[desktop]'
          python -m pip install 'pyinstaller>=6.10,<7.0'

      - name: Build macOS application
        shell: bash
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --windowed \
            --name 'TransportERP-UA' \
            --paths 'backend/src' \
            --add-data 'frontend/out:frontend' \
            --collect-all webview \
            --osx-bundle-identifier 'ua.transport.erp' \
            'backend/src/transport_erp/desktop.py'
          test -x 'dist/TransportERP-UA.app/Contents/MacOS/TransportERP-UA'
          if find 'dist/TransportERP-UA.app' -type f \( -name '*.db' -o -name '*.sqlite' -o -name '*.sqlite3' \) -print -quit | grep -q .; then
            echo 'Database unexpectedly bundled in macOS app' >&2
            exit 1
          fi
          file 'dist/TransportERP-UA.app/Contents/MacOS/TransportERP-UA' | grep -q '${{ matrix.arch }}'
          codesign --force --deep --sign - 'dist/TransportERP-UA.app'
          codesign --verify --deep --strict 'dist/TransportERP-UA.app'
          TRANSPORT_ERP_SMOKE_TEST_ONLY=1 'dist/TransportERP-UA.app/Contents/MacOS/TransportERP-UA'

      - name: Create macOS Portable ZIP
        shell: bash
        run: |
          bundle_dir="TransportERP-UA_v0_2_TEST_r8_macOS_${{ matrix.arch }}"
          mkdir "$bundle_dir"
          mv 'dist/TransportERP-UA.app' "$bundle_dir/TransportERP-UA.app"
          printf '%s\n' \
            'TransportERP-UA v0.2 TEST r8' \
            'Business data are stored outside this application bundle.' \
            'Persistent data: ~/Library/Application Support/TransportERP-UA' \
            'This testing build is ad-hoc signed and not notarized.' \
            > "$bundle_dir/README-START.txt"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$bundle_dir" "${bundle_dir}_Portable.zip"

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: TransportERP-UA-v0.2-r8-macOS-${{ matrix.arch }}
          path: TransportERP-UA_v0_2_TEST_r8_macOS_${{ matrix.arch }}_Portable.zip
          if-no-files-found: error
          retention-days: 90

  publish-release:
    needs:
      - build-start
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact r8 source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verified release assets
        uses: actions/download-artifact@v4
        with:
          pattern: TransportERP-UA-v0.2-r8-*
          path: release-assets
          merge-multiple: true

      - name: Prepare checksums
        shell: bash
        run: |
          mkdir release-upload
          find release-assets -type f -name 'TransportERP-UA_v0_2_TEST_r8_START.zip' -exec cp '{}' release-upload/ \;
          find release-assets -type f -name 'TransportERP-UA_v0_2_TEST_r8_Setup_Windows_x64.exe' -exec cp '{}' release-upload/ \;
          find release-assets -type f -name 'TransportERP-UA_v0_2_TEST_r8_Windows_x64_Portable.zip' -exec cp '{}' release-upload/ \;
          find release-assets -type f -name 'TransportERP-UA_v0_2_TEST_r8_macOS_arm64_Portable.zip' -exec cp '{}' release-upload/ \;
          find release-assets -type f -name 'TransportERP-UA_v0_2_TEST_r8_macOS_x86_64_Portable.zip' -exec cp '{}' release-upload/ \;
          test -f release-upload/TransportERP-UA_v0_2_TEST_r8_START.zip
          test -f release-upload/TransportERP-UA_v0_2_TEST_r8_Setup_Windows_x64.exe
          test -f release-upload/TransportERP-UA_v0_2_TEST_r8_Windows_x64_Portable.zip
          test -f release-upload/TransportERP-UA_v0_2_TEST_r8_macOS_arm64_Portable.zip
          test -f release-upload/TransportERP-UA_v0_2_TEST_r8_macOS_x86_64_Portable.zip
          cd release-upload
          sha256sum \
            TransportERP-UA_v0_2_TEST_r8_START.zip \
            TransportERP-UA_v0_2_TEST_r8_Setup_Windows_x64.exe \
            TransportERP-UA_v0_2_TEST_r8_Windows_x64_Portable.zip \
            TransportERP-UA_v0_2_TEST_r8_macOS_arm64_Portable.zip \
            TransportERP-UA_v0_2_TEST_r8_macOS_x86_64_Portable.zip \
            > SHA256SUMS_v0_2_TEST_r8.txt
          sha256sum -c SHA256SUMS_v0_2_TEST_r8.txt

      - name: Publish v0.2-r8 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v0.2-r8 >/dev/null 2>&1; then
            gh release edit v0.2-r8 \
              --title 'TransportERP-UA v0.2 r8 — executable testing release' \
              --notes-file RELEASE_NOTES_v0_2_r8.md \
              --prerelease
          else
            gh release create v0.2-r8 \
              --target "$GITHUB_SHA" \
              --title 'TransportERP-UA v0.2 r8 — executable testing release' \
              --notes-file RELEASE_NOTES_v0_2_r8.md \
              --prerelease
          fi
          gh release upload v0.2-r8 release-upload/* --clobber

      - name: Preserve release manifest
        uses: actions/upload-artifact@v4
        with:
          name: TransportERP-UA-v0.2-r8-release-manifest
          path: |
            release-upload/TransportERP-UA_v0_2_TEST_r8_START.zip
            release-upload/SHA256SUMS_v0_2_TEST_r8.txt
          if-no-files-found: error
          retention-days: 90
