name: Windows EXE Control Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-control:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        shell: pwsh
        run: |
          $version = (Get-Content PREVIEW_VERSION.txt -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($version)) { throw "PREVIEW_VERSION.txt is empty" }
          "PREVIEW_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BUNDLE_DIR=TransportERP-UA_v$($version)_CONTROL_Windows_x64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BUNDLE_ZIP=TransportERP-UA_v$($version)_CONTROL_Windows_x64_Portable.zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Test and build frontend
        working-directory: frontend
        run: |
          npm install
          npm run lint
          npm run typecheck
          npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install, test and package backend
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".\backend[desktop,dev]"
          python -m pip install "pyinstaller>=6.10,<7.0"
          Push-Location backend
          ruff check .
          mypy
          pytest -q
          Pop-Location

      - name: Build Windows portable application
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --windowed `
            --name "TransportERP-UA" `
            --paths "backend/src" `
            --add-data "frontend/out;frontend" `
            --collect-all webview `
            "backend/src/transport_erp/desktop.py"
          Move-Item "dist/TransportERP-UA" "dist/$env:BUNDLE_DIR"

      - name: Verify packaged application
        shell: pwsh
        run: |
          $bundle = "dist/$env:BUNDLE_DIR"
          if (!(Test-Path "$bundle/TransportERP-UA.exe")) { throw "TransportERP-UA.exe not found" }
          $db = Get-ChildItem $bundle -Recurse -File -Include *.db,*.sqlite,*.sqlite3
          if ($db) { throw "Database unexpectedly bundled: $($db.FullName -join ', ')" }

          $env:TRANSPORT_ERP_SMOKE_TEST_ONLY = "1"
          $process = Start-Process -FilePath "$bundle/TransportERP-UA.exe" -PassThru
          if (-not $process.WaitForExit(30000)) {
            Stop-Process -Id $process.Id -Force
            throw "Packaged TransportERP-UA control build smoke test timed out"
          }
          Remove-Item Env:TRANSPORT_ERP_SMOKE_TEST_ONLY -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 0) {
            throw "Packaged TransportERP-UA control build failed smoke test with exit code $($process.ExitCode)"
          }

      - name: Add control build notes
        shell: pwsh
        run: |
          $notes = @"
          TransportERP-UA v$env:PREVIEW_VERSION — Windows CONTROL build

          Це контрольна EXE-збірка. Поточна щоденна розробка тестується через START_WINDOWS.bat у Python-середовищі.

          Запуск:
          1. Повністю розпакуйте ZIP.
          2. Запустіть TransportERP-UA.exe.
          3. Бізнес-дані не входять до пакета.
          "@
          Set-Content -Path "dist/$env:BUNDLE_DIR/README-START.txt" -Value $notes -Encoding UTF8

      - name: Create portable ZIP and checksum
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/$env:BUNDLE_DIR" -DestinationPath "$env:BUNDLE_ZIP" -Force
          $hash = (Get-FileHash "$env:BUNDLE_ZIP" -Algorithm SHA256).Hash.ToLower()
          "$hash  $env:BUNDLE_ZIP" | Set-Content "SHA256SUMS_v$env:PREVIEW_VERSION.txt" -Encoding ascii

      - name: Upload Windows control package
        uses: actions/upload-artifact@v4
        with:
          name: TransportERP-UA-v${{ env.PREVIEW_VERSION }}-Windows-control
          path: |
            ${{ env.BUNDLE_ZIP }}
            SHA256SUMS_v${{ env.PREVIEW_VERSION }}.txt
          if-no-files-found: error
          retention-days: 30
