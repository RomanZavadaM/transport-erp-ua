name: Windows Preview

on:
  push:
    branches:
      - preview/windows-0.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-preview:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run lint
          npm run typecheck
          npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install desktop runtime and packager
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[desktop]"
          pip install "pyinstaller>=6.10,<7.0"

      - name: Build portable desktop application
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --windowed `
            --name "TransportERP-UA-Preview" `
            --paths "backend/src" `
            --add-data "frontend/out;frontend" `
            --collect-all webview `
            "backend/src/transport_erp/desktop.py"

      - name: Smoke test packaged application
        continue-on-error: true
        shell: pwsh
        run: |
          $env:TRANSPORT_ERP_SMOKE_TEST_ONLY = "1"
          $process = Start-Process `
            -FilePath "dist/TransportERP-UA-Preview/TransportERP-UA-Preview.exe" `
            -PassThru
          if (-not $process.WaitForExit(30000)) {
            Stop-Process -Id $process.Id -Force
            throw "Packaged TransportERP-UA preview smoke test timed out"
          }
          Remove-Item Env:TRANSPORT_ERP_SMOKE_TEST_ONLY -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 0) {
            throw "Packaged TransportERP-UA preview failed smoke test with exit code $($process.ExitCode)"
          }

      - name: Add preview notes
        if: always()
        shell: pwsh
        run: |
          $notes = @'
          TransportERP-UA — Windows Preview 0.1

          ЦЕ ОГЛЯДОВА ТЕСТОВА ЗБІРКА.

          Запуск:
          1. Розпакуйте ZIP у звичайну папку.
          2. Запустіть TransportERP-UA-Preview.exe.
          3. Windows може показати SmartScreen, оскільки preview-збірка ще не підписана цифровим сертифікатом.

          ВАЖЛИВО:
          Автоматичний smoke-test desktop shell на GitHub Actions поки нестабільний.
          ZIP публікується спеціально для ручної перевірки на реальному Windows ПК.
          Якщо вікно не відкриється — повідомте, що саме сталося (нічого / помилка / зависання), бажано зі скріном.

          Уже можна оглянути:
          - головну панель;
          - налаштування підприємства;
          - автобуси: додавання, редагування, статус, картка;
          - документи автобуса;
          - показання одометра;
          - водії: додавання, редагування, статус, картка;
          - документи водія;
          - зупинки;
          - маршрути та порядок зупинок;
          - стан локальної SQLite бази;
          - створення ZIP резервної копії.

          Дані preview зберігаються окремо у профілі користувача Windows:
          %LOCALAPPDATA%\TransportERP-UA

          Для чистого повторного тесту закрийте програму й перейменуйте цю папку.
          '@
          Set-Content -Path "dist/TransportERP-UA-Preview/README-START.txt" -Value $notes -Encoding UTF8

      - name: Create portable ZIP
        if: always()
        shell: pwsh
        run: |
          $zip = "TransportERP-UA-Preview-0.1-Windows-x64.zip"
          Compress-Archive -Path "dist/TransportERP-UA-Preview/*" -DestinationPath $zip -Force
          Get-Item $zip | Format-List Name,Length

      - name: Upload Windows preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TransportERP-UA-Preview-0.1-Windows-x64
          path: TransportERP-UA-Preview-0.1-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
